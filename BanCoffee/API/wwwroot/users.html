<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Tài khoản - BanCoffee</title>
    <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body id="page-top">
    <div id="wrapper" class="d-flex">
        <!-- Sidebar -->
        <ul class="navbar-nav sidebar sidebar-dark accordion" id="accordionSidebar"></ul>
        
        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column w-100">
            <!-- Topbar -->
            <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top px-4">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown no-arrow">
                        <a class="nav-link dropdown-toggle text-dark" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <span class="me-2 d-none d-lg-inline text-gray-600 small" id="userDropdownName">Loading...</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-end">
                            <a class="dropdown-item" href="#" id="btnLogout">Đăng xuất</a>
                        </div>
                    </li>
                </ul>
            </nav>
            
            <!-- Main Content -->
            <div class="container-fluid px-4">
                <h1 class="h3 mb-4 text-gray-800">Quản lý Tài khoản (Nhân viên)</h1>
                
                <div class="card mb-4">
                    <div class="card-header py-3 d-flex justify-content-between align-items-center">
                        <h6 class="m-0 fw-bold text-primary">Danh sách nhân viên</h6>
                        <button class="btn btn-primary btn-sm" onclick="showAddModal()">+ Thêm mới</button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table align-middle" id="userTable" width="100%" cellspacing="0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Họ Tên</th>
                                        <th>Tài khoản</th>
                                        <th>Email</th>
                                        <th>Địa chỉ</th>
                                        <th>Vai trò</th>
                                        <th style="width: 140px;">Hành động</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr><td colspan="6" class="text-center">Đang tải dữ liệu...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- User Modal (Add/Edit) -->
    <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true" data-roles="Admin">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="userModalLabel">Thêm Tài khoản mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="userForm" autocomplete="off">
                        <input type="hidden" id="userId">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Tài khoản *</label>
                                <input type="text" class="form-control" id="taikhoan" value="" autocomplete="off" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Mật khẩu (Bỏ trống nếu không đổi)</label>
                                <input type="password" class="form-control" id="matkhau" value="" autocomplete="new-password">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Họ tên *</label>
                                <input type="text" class="form-control" id="hoten" value="" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Vai trò *</label>
                                <select class="form-select" id="role" required>
                                    <option value="PhucVu">Phục vụ (PhucVu)</option>
                                    <option value="ThuNgan">Thu ngân (ThuNgan)</option>
                                    <option value="Bep">Bếp / Pha chế (Bep)</option>
                                    <option value="Admin">Quản trị viên (Admin)</option>
                                    <option value="Staff">Nhân viên chung (Staff)</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" value="">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Địa chỉ</label>
                                <input type="text" class="form-control" id="diachi" value="" placeholder="Hà Nội, Hưng Yên...">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="saveUser()">Lưu lại</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/assets/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/users.js"></script>
</body>
</html>
