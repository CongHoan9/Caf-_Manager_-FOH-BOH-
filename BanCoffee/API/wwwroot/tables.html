<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ đồ Bàn (POS) - BanCoffee</title>
    <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/style.css" rel="stylesheet">
    <style>
        .table-card { cursor: pointer; }
        .bg-trong { background-color: #e2f0d9; }
        .bg-dang-phuc-vu { background-color: #fff2cc; }
        .bg-da-dat { background-color: #fce4d6; }
    </style>
</head>
<body id="page-top">
    <div id="wrapper" class="d-flex">
        <!-- Sidebar -->
        <ul class="navbar-nav sidebar sidebar-dark accordion" id="accordionSidebar"></ul>

        <div id="content-wrapper" class="d-flex flex-column w-100">
            <!-- Topbar -->
            <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top px-4">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown no-arrow">
                        <a class="nav-link dropdown-toggle text-dark" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <span class="me-2 d-none d-lg-inline text-gray-600 small" id="userDropdownName">Loading...</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-end">
                            <a class="dropdown-item" href="#" id="btnLogout">Đăng xuất</a>
                        </div>
                    </li>
                </ul>
            </nav>

            <!-- Main Content -->
            <div class="container-fluid px-4">
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <div>
                        <h1 class="h3 mb-0 text-gray-800">Sơ đồ Bàn &amp; Order tại Bàn</h1>
                        <small class="text-muted">Click vào bàn để gọi món hoặc thanh toán.</small>
                    </div>
                    <div id="tableHeaderActions"></div>
                </div>
                
                <div class="row" id="tableContainer"></div>
            </div>
        </div>
    </div>

    <!-- Modal Add/Edit Table (chỉ giữ trong DOM khi là Admin) -->
    <div class="modal fade" id="tableModal" tabindex="-1" data-roles="Admin">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tableModalTitle">Thêm bàn mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="tableId">
                    <div class="mb-3">
                        <label class="form-label">Tên bàn *</label>
                        <input type="text" class="form-control" id="tableName" value="" placeholder="VD: Bàn 04">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Khu vực</label>
                        <input type="text" class="form-control" id="tableZone" value="" placeholder="VD: Tầng 1, Sân vườn...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Số chỗ</label>
                        <input type="number" class="form-control" id="tableCapacity" min="1" value="" placeholder="VD: 4">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Trạng thái</label>
                        <select class="form-select" id="tableStatus">
                            <option value="Trống">Trống</option>
                            <option value="Đang phục vụ">Đang phục vụ</option>
                            <option value="Đã đặt">Đã đặt</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer d-flex justify-content-between" id="tableModalFooter">
                    <div id="deleteTableSlot"></div>
                    <div class="ms-auto">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="btn btn-primary" onclick="saveTable()">Lưu lại</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Order POS Modal -->
    <div class="modal fade" id="orderModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Đơn hàng - <span id="posTableName"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="posTableId">
                    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                        <div class="d-flex gap-2">
                            <button class="btn btn-success fw-bold" onclick="openAddItemModal()">+ Thêm Món</button>
                            <button class="btn btn-danger" onclick="clearOrder()">Hủy Đơn / Trả Bàn</button>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <span class="small text-muted">Đổi trạng thái bàn:</span>
                            <select class="form-select form-select-sm" id="posTableQuickStatus" style="width: 150px;" onchange="quickChangeTableStatus(this.value)">
                                <option value="Trống">Trống</option>
                                <option value="Đang phục vụ">Đang phục vụ</option>
                                <option value="Đã đặt">Đã đặt</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Món</th>
                                    <th class="text-center">SL</th>
                                    <th class="text-end">Đơn giá</th>
                                    <th>Ghi chú</th>
                                    <th class="text-center">Trạng thái Bếp</th>
                                </tr>
                            </thead>
                            <tbody id="posOrderList">
                                <tr><td colspan="5" class="text-center">Chưa có dữ liệu</td></tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="row align-items-center mt-3">
                        <div class="col-md-6" id="posPaymentMethodSlot"></div>
                        <div class="col-md-6 text-end ms-auto">
                            <h4 class="text-danger fw-bold mb-0">Tổng cộng: <span id="posTotal">0</span> đ</h4>
                        </div>
                    </div>
                </div>
                <div class="modal-footer" id="posFooter">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <span id="posCheckoutSlot"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Item Modal -->
    <div class="modal fade" id="addItemModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Thêm món vào Bàn</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Chọn món *</label>
                        <select class="form-select" id="addSelectMenu"></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Số lượng *</label>
                        <input type="number" class="form-control" id="addQty" value="" min="1" placeholder="Nhập số lượng (VD: 1)">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ghi chú (Ít đá, ít đường...)</label>
                        <input type="text" class="form-control" id="addNote" value="">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-success fw-bold" onclick="confirmAddItem()">Gửi xuống Bếp</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/tables.js"></script>
</body>
</html>
