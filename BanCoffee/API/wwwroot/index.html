<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BanCoffee - Đăng nhập Hệ thống</title>
    <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-primary">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-xl-5 col-lg-6 col-md-8">
                <div class="card my-5">
                    <div class="card-body p-0">
                        <div class="p-4 p-md-5">
                            <div class="text-center">
                                <h1 class="h4 text-gray-900 mb-2 fw-bold">Đăng nhập BanCoffee</h1>
                                <p class="text-muted small mb-4">Hệ thống Quản lý Quán Cà phê</p>
                            </div>
                            <form id="loginForm" autocomplete="off">
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Tên đăng nhập</label>
                                    <input type="text" class="form-control" id="txtUsername" value="" autocomplete="off" placeholder="Nhập tài khoản..." required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Mật khẩu</label>
                                    <input type="password" class="form-control" id="txtPassword" value="" autocomplete="new-password" placeholder="Nhập mật khẩu..." required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 fw-bold py-2">ĐĂNG NHẬP</button>
                            </form>
                            <div id="loginAlert" class="alert alert-danger mt-3 d-none" role="alert"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/login.js"></script>
</body>
</html>
