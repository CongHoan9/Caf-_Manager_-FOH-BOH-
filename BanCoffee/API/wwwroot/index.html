<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BanCoffee - Đăng nhập Quản trị</title>
    <!-- Bootstrap CSS -->
    <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-primary">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-xl-5 col-lg-6 col-md-8">
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <div class="p-5">
                            <div class="text-center">
                                <h1 class="h4 text-gray-900 mb-4">Đăng nhập BanCoffee</h1>
                            </div>
                            <form id="loginForm">
                                <div class="mb-3">
                                    <input type="text" class="form-control form-control-user" id="txtUsername" placeholder="Tên đăng nhập" required>
                                </div>
                                <div class="mb-3">
                                    <input type="password" class="form-control form-control-user" id="txtPassword" placeholder="Mật khẩu" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 btn-user">Đăng Nhập</button>
                            </form>
                            <div id="loginAlert" class="alert alert-danger mt-3 d-none" role="alert"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/login.js"></script>
</body>
</html>
