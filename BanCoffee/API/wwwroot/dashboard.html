<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BanCoffee - Tổng quan (Dashboard)</title>
    <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body id="page-top">
    <div id="wrapper" class="d-flex">
        <!-- Sidebar -->
        <ul class="navbar-nav sidebar sidebar-dark accordion" id="accordionSidebar"></ul>
        
        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column w-100">
            <!-- Topbar -->
            <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top px-4">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown no-arrow">
                        <a class="nav-link dropdown-toggle text-dark" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <span class="me-2 d-none d-lg-inline text-gray-600 small" id="userDropdownName">Loading...</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-end">
                            <a class="dropdown-item" href="#" id="btnLogout">Đăng xuất</a>
                        </div>
                    </li>
                </ul>
            </nav>
            
            <!-- Main Content -->
            <div class="container-fluid px-4">
                <h1 class="h3 mb-4 text-gray-800">Tổng quan hoạt động (Dashboard)</h1>
                <div class="row">
                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card h-100 py-2">
                            <div class="card-body">
                                <div class="text-xs fw-bold text-primary text-uppercase mb-1">Tổng Doanh Thu</div>
                                <div class="h5 mb-0 fw-bold text-gray-800" id="dashDoanhThu">0 đ</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card h-100 py-2">
                            <div class="card-body">
                                <div class="text-xs fw-bold text-success text-uppercase mb-1">Tổng số Hóa đơn</div>
                                <div class="h5 mb-0 fw-bold text-gray-800" id="dashSoHoaDon">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card h-100 py-2">
                            <div class="card-body">
                                <div class="text-xs fw-bold text-warning text-uppercase mb-1">Bàn đang phục vụ / Tổng bàn</div>
                                <div class="h5 mb-0 fw-bold text-gray-800" id="dashBan">0 / 0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card h-100 py-2">
                            <div class="card-body">
                                <div class="text-xs fw-bold text-info text-uppercase mb-1">Số món trên Menu</div>
                                <div class="h5 mb-0 fw-bold text-gray-800" id="dashSoMon">0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header py-3 d-flex justify-content-between align-items-center">
                        <h6 class="m-0 fw-bold text-primary">Hóa đơn gần đây</h6>
                        <a href="hoadon.html" class="btn btn-sm btn-primary">Xem tất cả</a>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table align-middle mb-0" id="recentHoaDonTable">
                                <thead class="table-light">
                                    <tr>
                                        <th>Mã HĐ</th>
                                        <th>Khách hàng</th>
                                        <th>Ngày tạo</th>
                                        <th>Hình thức TT</th>
                                        <th class="text-end">Thành tiền</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr><td colspan="5" class="text-center">Đang tải...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/assets/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const hds = await fetchAPI('/HoaDon/search', 'POST', { page: 1, pageSize: 100 });
                if (hds && hds.data) {
                    const totalRev = hds.data.reduce((s, x) => s + (Number(x.thanh_tien) || 0), 0);
                    document.getElementById('dashDoanhThu').innerText = totalRev.toLocaleString('vi-VN') + ' đ';
                    document.getElementById('dashSoHoaDon').innerText = hds.totalItems || hds.data.length;

                    const tbody = document.querySelector('#recentHoaDonTable tbody');
                    tbody.innerHTML = '';
                    const recent = hds.data.slice(0, 5);
                    if (recent.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="text-center">Chưa có hóa đơn</td></tr>';
                    } else {
                        recent.forEach(hd => {
                            tbody.innerHTML += `
                                <tr>
                                    <td>${(hd.ma_hoa_don || '').substring(0, 8)}...</td>
                                    <td class="fw-bold">${hd.ho_ten || 'Khách lẻ'}</td>
                                    <td>${new Date(hd.ngay_tao).toLocaleString('vi-VN')}</td>
                                    <td><span class="badge bg-secondary">${hd.hinh_thuc_thanh_toan}</span></td>
                                    <td class="text-end fw-bold text-primary">${Number(hd.thanh_tien).toLocaleString('vi-VN')} đ</td>
                                </tr>
                            `;
                        });
                    }
                }
            } catch (e) { console.error(e); }

            try {
                const bans = await fetchAPI('/Ban/get-all', 'GET');
                if (bans) {
                    const active = bans.filter(b => b.trang_thai === 'Đang phục vụ' || b.trang_thai === 'Đang sử dụng').length;
                    document.getElementById('dashBan').innerText = `${active} / ${bans.length}`;
                }
            } catch (e) { console.error(e); }

            try {
                const items = await fetchAPI('/Item/get-all', 'GET');
                if (items) {
                    document.getElementById('dashSoMon').innerText = items.length;
                }
            } catch (e) { console.error(e); }
        });
    </script>
</body>
</html>
