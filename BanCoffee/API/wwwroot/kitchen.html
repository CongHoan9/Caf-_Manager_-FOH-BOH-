<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màn hình Bếp / Pha chế - BanCoffee</title>
    <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/style.css" rel="stylesheet">
    <style>
        .kanban-col {
            min-height: 60vh;
            background: #f8f9fc;
            padding: 12px;
        }
        .ticket-card {
            background: #fff;
            padding: 14px;
            margin-bottom: 12px;
        }
        .item-time { font-size: 0.8rem; color: #858796; }
    </style>
</head>
<body id="page-top">
    <div id="wrapper" class="d-flex">
        <!-- Sidebar -->
        <ul class="navbar-nav sidebar sidebar-dark accordion" id="accordionSidebar"></ul>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column w-100">
            <!-- Topbar -->
            <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top px-4">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown no-arrow">
                        <a class="nav-link dropdown-toggle text-dark" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <span class="me-2 d-none d-lg-inline text-gray-600 small" id="userDropdownName">Loading...</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-end">
                            <a class="dropdown-item" href="#" id="btnLogout">Đăng xuất</a>
                        </div>
                    </li>
                </ul>
            </nav>

            <!-- Main Content -->
            <div class="container-fluid px-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h3 mb-0 text-gray-800">Màn hình Bếp / Pha chế (Kanban 3 Cột)</h1>
                    <button class="btn btn-sm btn-primary" onclick="loadQueue()">Làm mới ngay</button>
                </div>

                <div class="row">
                    <!-- Cột 1: Chờ làm -->
                    <div class="col-md-4 mb-4">
                        <div class="card">
                            <div class="card-header bg-warning text-dark fw-bold d-flex justify-content-between align-items-center">
                                <span>1. HÀNG CHỜ ĐƠN HÀNG</span>
                                <span class="badge bg-dark" id="count-0">0</span>
                            </div>
                            <div class="card-body kanban-col" id="col-state-0"></div>
                        </div>
                    </div>

                    <!-- Cột 2: Đang pha chế -->
                    <div class="col-md-4 mb-4">
                        <div class="card">
                            <div class="card-header bg-primary text-white fw-bold d-flex justify-content-between align-items-center">
                                <span>2. ĐANG PHA CHẾ</span>
                                <span class="badge bg-light text-dark" id="count-1">0</span>
                            </div>
                            <div class="card-body kanban-col" id="col-state-1"></div>
                        </div>
                    </div>

                    <!-- Cột 3: Đã xong chờ giao -->
                    <div class="col-md-4 mb-4">
                        <div class="card">
                            <div class="card-header bg-success text-white fw-bold d-flex justify-content-between align-items-center">
                                <span>3. ĐÃ XONG - CẦN GIAO KHÁCH</span>
                                <span class="badge bg-light text-dark" id="count-2">0</span>
                            </div>
                            <div class="card-body kanban-col" id="col-state-2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/kitchen.js"></script>
</body>
</html>
